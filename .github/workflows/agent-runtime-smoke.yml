name: agent-runtime-smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'chrome-extension/**'
      - 'supabase/functions/agent-run/**'
      - 'supabase/functions/_shared/byok-passthrough.ts'
      - '.github/workflows/agent-runtime-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chrome-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chrome-extension/package-lock.json

      - name: Install (frozen lockfile)
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest unit tests (includes ai-pin assertion + future BYOK leak grep)
        run: npm test

      - name: Sentinel — pin must be exact 5.x.x (defense in depth)
        run: |
          node -e "
            const p = require('./package.json');
            const v = p.dependencies.ai;
            if (!v || !/^5\.\d+\.\d+$/.test(v)) {
              console.error('FAIL: dependencies.ai must be exact 5.x.x; got:', v);
              process.exit(1);
            }
            console.log('OK: dependencies.ai =', v);
          "
